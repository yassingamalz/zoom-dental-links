<style>
:root{
  --ink:        #0A3034;
  --ink-soft:   #4C6E72;
  --brand:      #14A3AF;   /* sampled from the logo mark */
  --brand-deep: #0B6E77;   /* darkened for text & buttons — passes contrast */
  --gold:       #B08420;
  --paper:      #FFFFFF;
  --porcelain:  #F3F8F8;
  --line:       #DBE9EA;
  --radius:     18px;
  --shadow:     0 1px 2px rgba(11,46,48,.05), 0 12px 32px -12px rgba(11,46,48,.16);
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  min-height:100dvh;
  padding:34px 20px calc(40px + env(safe-area-inset-bottom));
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 60% at 50% -8%, #E2F2F3 0%, rgba(226,242,243,0) 62%),
    var(--porcelain);
  display:flex;
  justify-content:center;
}

.page{ width:100%; max-width:420px; }

/* ── reveal ─────────────────────────────────────────────── */
.rise{ opacity:0; transform:translateY(14px); animation:rise .62s cubic-bezier(.22,.9,.3,1) forwards; }
@keyframes rise{ to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){
  .rise{ animation:none; opacity:1; transform:none; }
}

/* ── header ─────────────────────────────────────────────── */
.crest{
  width:96px; height:96px; margin:0 auto 20px;
  border-radius:50%;
  display:block;
  box-shadow:0 10px 26px -12px rgba(11,110,119,.55);
}
.crest img{ width:100%; height:100%; display:block; }

h1{
  margin:0;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:2.45rem;
  line-height:1.04;
  font-weight:400;
  letter-spacing:-.015em;
  text-align:center;
}
.name-ar{
  margin:9px 0 0;
  text-align:center;
  font-family:"IBM Plex Sans Arabic",sans-serif;
  font-size:.98rem;
  font-weight:500;
  color:var(--ink-soft);
  direction:rtl;
}
.district{
  margin:14px 0 0;
  text-align:center;
  font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
}

/* ── status ─────────────────────────────────────────────── */
.status{
  margin:22px auto 26px;
  width:fit-content;
  display:flex; align-items:center; gap:9px;
  padding:8px 16px 8px 13px;
  border-radius:999px;
  background:var(--paper);
  border:1px solid var(--line);
  font-size:.83rem; font-weight:600;
  box-shadow:0 1px 2px rgba(11,46,48,.04);
}
.dot{ width:8px; height:8px; border-radius:50%; background:#94A3A4; flex:none; }
.status.is-open .dot{
  background:#12A150;
  box-shadow:0 0 0 0 rgba(18,161,80,.45);
  animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{ 70%{ box-shadow:0 0 0 9px rgba(18,161,80,0); } 100%{ box-shadow:0 0 0 0 rgba(18,161,80,0); } }
@media (prefers-reduced-motion:reduce){ .status.is-open .dot{ animation:none; } }
.status .muted{ font-weight:500; color:var(--ink-soft); }

/* ── the slip (signature element) ───────────────────────── */
.slip{
  position:relative;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px 20px;
  margin-bottom:26px;
}
.slip::before,.slip::after{
  content:""; position:absolute; top:96px;
  width:18px; height:18px; border-radius:50%;
  background:var(--porcelain);
  border:1px solid var(--line);
}
.slip::before{ left:-10px; clip-path:inset(0 0 0 9px); }
.slip::after{  right:-10px; clip-path:inset(0 9px 0 0); }

.slip-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:"IBM Plex Mono",monospace;
  font-size:.62rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-soft);
  padding-bottom:14px;
}
.slip-title{
  font-family:"Instrument Serif",Georgia,serif;
  font-size:1.42rem; line-height:1.2; margin:0 0 4px;
}
.slip-sub{
  margin:0 0 18px;
  font-family:"IBM Plex Sans Arabic",sans-serif;
  direction:rtl; text-align:right;
  font-size:.9rem; color:var(--ink-soft);
}
.perf{
  border:0; border-top:1px dashed var(--line);
  margin:0 -20px 18px;
}

.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:16px 18px;
  border-radius:13px;
  font-family:"IBM Plex Sans Arabic","Plus Jakarta Sans",sans-serif;
  font-size:1.02rem; font-weight:600;
  text-decoration:none;
  border:1px solid transparent;
  transition:transform .12s ease, box-shadow .18s ease, background .18s ease;
}
.btn svg{ flex:none; }
.btn-primary{
  background:var(--brand-deep); color:#fff;
  box-shadow:0 8px 20px -8px rgba(11,110,119,.65);
}
.btn-primary:hover{ background:#095B63; }
.btn-secondary{
  background:var(--paper); color:var(--ink);
  border-color:var(--line);
  margin-top:10px;
}
.btn-secondary:hover{ background:#F6FBFB; }
.btn:active{ transform:scale(.985); }
.btn:focus-visible,a:focus-visible{ outline:2px solid var(--brand); outline-offset:3px; }
.btn-secondary .num{
  font-family:"IBM Plex Mono",monospace; font-size:.9rem;
  letter-spacing:.02em; color:var(--ink-soft); direction:ltr;
}

/* ── services ───────────────────────────────────────────── */
.services{
  display:flex; flex-wrap:wrap; gap:7px; justify-content:center;
  margin:0 0 26px; padding:0; list-style:none;
  direction:rtl;
}
.services li{
  font-family:"IBM Plex Sans Arabic",sans-serif;
  font-size:.8rem; font-weight:500; color:var(--ink-soft);
  padding:6px 13px; border-radius:999px;
  background:rgba(255,255,255,.7);
  border:1px solid var(--line);
}

/* ── link list ──────────────────────────────────────────── */
.links{
  list-style:none; margin:0 0 26px; padding:0;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(11,46,48,.04);
  overflow:hidden;
}
.links li + li{ border-top:1px solid var(--line); }
.links a{
  display:flex; align-items:center; gap:14px;
  padding:15px 17px;
  text-decoration:none; color:var(--ink);
  transition:background .15s ease;
}
.links a:hover{ background:#F6FBFB; }
.ic{
  width:34px; height:34px; flex:none;
  display:grid; place-items:center;
  border-radius:10px;
  background:#E4F3F4; color:var(--brand-deep);
}
.link-text{ flex:1; min-width:0; }
.link-label{
  font-family:"IBM Plex Sans Arabic",sans-serif;
  font-size:.95rem; font-weight:600; direction:rtl; text-align:left;
}
.link-sub{
  font-family:"IBM Plex Mono",monospace;
  font-size:.66rem; letter-spacing:.06em; color:var(--ink-soft);
  margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chev{ color:#B6C9C5; flex:none; }
.badge{
  font-family:"IBM Plex Sans Arabic",sans-serif;
  font-size:.68rem; font-weight:600;
  color:var(--gold); background:#FBF4E2;
  padding:3px 9px; border-radius:999px; flex:none;
}

/* ── hours ──────────────────────────────────────────────── */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(11,46,48,.04);
  padding:18px 17px;
  margin-bottom:16px;
}
.card-label{
  font-family:"IBM Plex Mono",monospace;
  font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 12px;
}
.hours{ margin:0; }
.hours-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 8px; border-radius:8px;
  font-size:.87rem;
}
.hours-row dt{ font-weight:500; }
.hours-row dd{
  margin:0;
  font-family:"IBM Plex Mono",monospace;
  font-size:.82rem; color:var(--ink-soft);
}
.hours-row.today{ background:#E4F3F4; }
.hours-row.today dt,.hours-row.today dd{ color:var(--brand-deep); font-weight:600; }
.hours-row.closed dd{ color:#9BAAA9; }

.addr{
  display:block; text-decoration:none; color:inherit;
}
.addr p{
  margin:0;
  font-family:"IBM Plex Sans Arabic",sans-serif;
  direction:rtl; text-align:right;
  font-size:.92rem; line-height:1.6;
}
.addr .go{
  display:block; margin-top:10px;
  font-family:"IBM Plex Mono",monospace;
  font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--brand); font-weight:500;
}

footer{
  margin-top:26px; text-align:center;
  font-family:"IBM Plex Mono",monospace;
  font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
  color:#9BAAA9;
}
footer a{ color:inherit; text-decoration:none; border-bottom:1px solid #DBE9EA; }
</style>
</head>

<script>
(function(){
  "use strict";
  const C = CONFIG;
  const $ = id => document.getElementById(id);

  /* ── where did this visit come from? (?src=flyer | ig | tiktok) ── */
  const src = (new URLSearchParams(location.search).get("src") || "").slice(0,20)
              .replace(/[^a-z0-9_-]/gi,"");

  /* ── header ───────────────────────────────────────────── */
  $("name").textContent     = C.clinicName;
  $("nameAr").textContent   = C.clinicNameAr;
  $("district").textContent = C.district;
  $("phoneText").textContent= C.phone;

  /* ── clock, pinned to Cairo regardless of the visitor's device ── */
  const DAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const IDX = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };

  function cairoNow(){
    const p = new Intl.DateTimeFormat("en-GB",{
      timeZone:C.timezone, weekday:"short", day:"2-digit", month:"short",
      hour:"2-digit", minute:"2-digit", hour12:false
    }).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});
    return {
      day:  IDX[p.weekday] ?? new Date().getDay(),
      mins: (+p.hour % 24) * 60 + (+p.minute),
      date: p.day + " " + p.month
    };
  }
  const toMins = t => (+t.split(":")[0]) * 60 + (+t.split(":")[1]);
  const pretty = t => { const [h,m]=t.split(":").map(Number);
    return ((h%12)||12) + ":" + String(m).padStart(2,"0") + (h<12?" AM":" PM"); };

  function readStatus(){
    const now = cairoNow();
    /* yesterday's shift may still be running if it crossed midnight */
    const prev = C.hours[(now.day+6)%7];
    if (prev){
      const s = toMins(prev[0]), e = toMins(prev[1]);
      if (e < s && now.mins < e) return { open:true, until:prev[1] };
    }
    const today = C.hours[now.day];
    if (today){
      const s = toMins(today[0]);
      let   e = toMins(today[1]); if (e < s) e += 1440;
      if (now.mins >= s && now.mins < e) return { open:true, until:today[1] };
      if (now.mins < s) return { open:false, nextDay:now.day, at:today[0] };
    }
    for (let i=1;i<=7;i++){
      const d = (now.day+i)%7;
      if (C.hours[d]) return { open:false, nextDay:d, at:C.hours[d][0] };
    }
    return { open:false };
  }

  function paintStatus(){
    const st = readStatus(), now = cairoNow();
    const el = $("status");
    el.classList.toggle("is-open", st.open);
    if (st.open){
      $("statusText").innerHTML = 'مفتوح الآن <span class="muted">· حتى ' + pretty(st.until) + '</span>';
    } else if (st.at){
      const when = st.nextDay === now.day ? "اليوم" : "يوم " +
        ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][st.nextDay];
      $("statusText").innerHTML = 'مغلق الآن <span class="muted">· يفتح ' + when + ' ' + pretty(st.at) + '</span>';
    } else {
      $("statusText").textContent = "مغلق الآن";
    }
    $("slipDate").textContent = now.date;
  }

  /* ── contact buttons ──────────────────────────────────── */
  const waText = C.waMessage + (src ? "\n(" + src + ")" : "");
  $("waBtn").href   = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(waText);
  $("callBtn").href = "tel:" + C.phoneDial;

  /* ── services ─────────────────────────────────────────── */
  $("services").innerHTML = C.services.map(s => "<li>" + s + "</li>").join("");

  /* ── secondary links ──────────────────────────────────── */
  const ICONS = {
    maps:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    instagram:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
    tiktok:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.82-2.48v-3.1a5.66 5.66 0 1 0 4.91 5.6V9.01a7.35 7.35 0 0 0 4.29 1.37V7.3a4.29 4.29 0 0 1-3.23-1.48Z"/></svg>',
    facebook:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h3l1-3h-4v-2c0-.55.45-1 1-1Z"/></svg>',
    tag:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.6 13.6 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 3Z"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"/></svg>',
    clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };
  const CHEV = '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  $("links").innerHTML = C.links.map(l => {
    const url = l.url === "MAPS" ? C.mapsUrl : l.url;
    return '<li><a href="' + url + '" target="_blank" rel="noopener">' +
             '<span class="ic">' + (ICONS[l.icon] || ICONS.tag) + '</span>' +
             '<span class="link-text"><span class="link-label">' + l.label + '</span>' +
             '<span class="link-sub">' + (l.sub || "") + '</span></span>' +
             (l.badge ? '<span class="badge">' + l.badge + '</span>' : "") + CHEV +
           '</a></li>';
  }).join("");

  /* ── hours table ──────────────────────────────────────── */
  const today = cairoNow().day;
  $("hours").innerHTML = [0,1,2,3,4,5,6].map(d => {
    const h = C.hours[d];
    const cls = "hours-row" + (d===today ? " today" : "") + (h ? "" : " closed");
    return '<div class="' + cls + '"><dt>' + DAYS_EN[d] + '</dt><dd>' +
           (h ? pretty(h[0]) + " – " + pretty(h[1]) : "Closed") + '</dd></div>';
  }).join("");

  /* ── address ──────────────────────────────────────────── */
  $("addrText").textContent = C.address;
  $("addr").href = C.mapsUrl;

  /* ── Meta Pixel (only if an ID is set) ────────────────── */
  if (C.metaPixelId){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', C.metaPixelId); fbq('track','PageView');
    ["waBtn","callBtn"].forEach(id => $(id).addEventListener("click", () =>
      fbq('track','Contact',{ method:id==="waBtn"?"whatsapp":"phone", source:src||"direct" })));
  }

  /* ── run, and keep the status honest ──────────────────── */
  paintStatus();
  setInterval(paintStatus, 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) paintStatus(); });
})();
